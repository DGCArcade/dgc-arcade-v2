:root{
  --bg0:#05030a; --bg1:#0c0718; --bg2:#1d0f38;
  --line:rgba(160,140,220,.16);
  --green:#37f0a4; --cyan:#54d0ff; --violet:#a972ff; --magenta:#ff6ad5; --red:#ff5b74; --gold:#ffcf5c;
  --txt:#ece8f7; --muted:#9b93b8;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg0);}
.dgc-root{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--txt);max-width:1080px;margin:0 auto;padding:0 14px 40px;position:relative;z-index:1;}
.display{font-family:'Orbitron','JetBrains Mono',monospace;font-weight:800;}
.wordmark{font-family:'Orbitron','JetBrains Mono',monospace;font-weight:900;font-style:italic;letter-spacing:.04em;background:linear-gradient(135deg,#8fe3ff 0%,#7aa8ff 28%,#a877ff 58%,#ff7ad4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(138,106,255,.45));}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(120% 80% at 50% -10%, #251247 0%, #0c0718 48%, #05030a 100%);overflow:hidden;}
.bg .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(160,140,220,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(160,140,220,.05) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(80% 60% at 50% 30%,#000 0%,transparent 90%);}
.star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 4s ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:.15;}50%{opacity:.85;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}

.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px);background:linear-gradient(180deg,rgba(8,4,16,.85),rgba(8,4,16,.4));}
.onlinepill{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.15em;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--txt);}
.onlinepill .dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px currentColor;animation:tw 2s infinite;}
.balpill{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.04);}

.nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.navbtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-family:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:11px;padding:.55rem .8rem;cursor:pointer;transition:.15s;white-space:nowrap;}
.navbtn:hover{color:var(--txt);border-color:var(--violet);}
.navbtn.active{color:#fff;background:linear-gradient(135deg,rgba(169,114,255,.25),rgba(255,106,213,.18));border-color:rgba(169,114,255,.55);box-shadow:0 0 18px rgba(169,114,255,.25);}

.main{animation:pop .4s ease both;}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(8px);}
.iconbubble{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(169,114,255,.25),rgba(255,106,213,.2));border:1px solid rgba(169,114,255,.4);color:#fff;box-shadow:0 0 16px rgba(169,114,255,.25);}

.field{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:.55rem .7rem;font-family:inherit;font-size:13px;width:100%;outline:none;}
.field:focus{border-color:var(--violet);}
.btn{font-family:inherit;cursor:pointer;border-radius:11px;border:1px solid var(--line);padding:.55rem .8rem;background:rgba(255,255,255,.04);color:var(--txt);letter-spacing:.08em;text-transform:uppercase;font-size:11px;transition:.15s;}
.btn:hover:not(:disabled){border-color:var(--violet);box-shadow:0 0 14px rgba(169,114,255,.3);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-on{background:linear-gradient(135deg,rgba(169,114,255,.3),rgba(255,106,213,.22));border-color:rgba(169,114,255,.5);color:#fff;}
.btn-primary{background:linear-gradient(135deg,var(--violet),var(--magenta));border:none;color:#fff;box-shadow:0 0 22px rgba(255,106,213,.3);font-weight:600;}
.btn-green{background:linear-gradient(135deg,#1bd98a,var(--green));border:none;color:#04140d;font-weight:700;box-shadow:0 0 22px rgba(55,240,164,.3);}

.gamegrid{display:grid;grid-template-columns:300px 1fr;gap:14px;}
.lobbygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.packgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:760px){.gamegrid{grid-template-columns:1fr;}.lobbygrid,.packgrid{grid-template-columns:repeat(2,1fr);}.statgrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:440px){.lobbygrid,.packgrid{grid-template-columns:1fr;}}

.hero{text-align:center;padding:30px 0 26px;}
.lobbycard{cursor:pointer;text-align:left;font-family:inherit;color:var(--txt);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;padding:20px;transition:.18s;animation:pop .5s ease both;}
.lobbycard:hover:not(:disabled){transform:translateY(-4px);border-color:rgba(169,114,255,.55);box-shadow:0 14px 40px rgba(120,60,200,.25);}
.lobbycard:disabled{opacity:.5;cursor:not-allowed;}
.lobbyicon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(84,208,255,.2),rgba(169,114,255,.22));border:1px solid rgba(169,114,255,.35);color:#fff;}
.pack:hover{border-color:rgba(255,207,92,.4);box-shadow:0 0 26px rgba(255,207,92,.12);}

.histchip{font-size:11px;padding:2px 7px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.25);}
.tile{border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:.12s;color:#fff;font-family:inherit;}
.tile:hover:not(:disabled){border-color:rgba(169,114,255,.5);}
.tile:disabled{cursor:default;}
.card{width:46px;height:64px;border-radius:8px;background:linear-gradient(160deg,#fff,#e7e2f5);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);}
.cardback{background:linear-gradient(135deg,#2a1550,#4a1f7a);border:1px solid rgba(169,114,255,.5);box-shadow:inset 0 0 16px rgba(169,114,255,.3),0 4px 14px rgba(0,0,0,.4);}

.rcell{font-family:inherit;color:#fff;font-size:12px;font-weight:700;border:1px solid rgba(0,0,0,.3);border-radius:7px;height:30px;cursor:pointer;transition:.12s;}
.rcell:hover:not(:disabled){outline:2px solid #fff;}
.rout{font-family:inherit;color:var(--txt);font-size:10px;letter-spacing:.06em;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:7px;height:30px;cursor:pointer;}
.rout:hover:not(:disabled){border-color:var(--violet);}
.chipdot{position:absolute;top:-7px;right:-6px;background:var(--gold);color:#3a2600;font-size:9px;font-weight:700;border-radius:10px;padding:0 4px;border:1px solid #fff;}

.toggle{width:42px;height:23px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.06);position:relative;cursor:pointer;transition:.18s;}
.toggle.on{background:linear-gradient(135deg,#1bd98a,var(--green));border-color:transparent;}
.toggle .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.18s;}
.toggle.on .knob{left:21px;}
.badge{font-size:9px;letter-spacing:.1em;padding:2px 7px;border-radius:6px;}
.badge.ok{background:rgba(55,240,164,.15);color:var(--green);}
.badge.bad{background:rgba(255,91,116,.15);color:var(--red);}
table th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;}
table td{padding:8px;}

.ftr{text-align:center;font-size:10px;letter-spacing:.18em;color:var(--muted);padding:24px 0 6px;text-transform:uppercase;}
input[type=range]{-webkit-appearance:none;height:6px;border-radius:5px;background:rgba(255,255,255,.1);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--violet);box-shadow:0 0 12px rgba(169,114,255,.6);cursor:pointer;}
