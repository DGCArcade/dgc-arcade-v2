services:
  # ── Backend API ──────────────────────────────────────────────────
  - type: web
    name: dgc-arcade-api
    runtime: node
    rootDir: .
    buildCommand: npm install -g pnpm && pnpm install && cd artifacts/api-server && pnpm run build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      # Optional Neon pooler URL — only if Neon gives you a separate pooled string
      - key: DATABASE_POOL_URL
        sync: false
      - key: PG_POOL_MAX
        value: "25"
      - key: PG_POOL_MIN
        value: "3"
      - key: JWT_SECRET
        sync: false
      - key: PLISIO_SECRET_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: CASINO_SECRET_SIGN
        sync: false
      - key: CASINO_PROVIDER_URL
        sync: false
      - key: CASINO_API_KEY
        sync: false
      - key: CASINO_MERCHANT_ID
        sync: false
      - key: API_URL
        sync: false
      - key: NODE_ENV
        value: production
      # ── DGC-AI1 ────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: PLISIO_API_KEY
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
      # ── Sports Betting (SportsGameOdds) ───────────────────────────
      # Get your key at https://sportsgameodds.com
      - key: SPORTS_GAME_ODDS_API_KEY
        sync: false
      # ── Owner Settings ─────────────────────────────────────────────
      # Must match the owner's username in the database (default: fanodgc)
      - key: OWNER_USERNAME
        value: "fanodgc"

  # ── Frontend ─────────────────────────────────────────────────────
  - type: web
    name: dgc-arcade-frontend
    runtime: node
    rootDir: .
    buildCommand: npm install -g pnpm && pnpm install && cd artifacts/dgc-arcade && pnpm run build
    startCommand: cd artifacts/dgc-arcade && pnpm run serve
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
