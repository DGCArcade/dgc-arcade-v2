services:
  # ── Backend API (Web Service) ────────────────────────────────────
  - type: web
    name: dgc-arcade-api
    runtime: node
    rootDir: .
    buildCommand: npm install -g pnpm && pnpm install && cd artifacts/api-server && pnpm run build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_URL
        sync: false
      - key: PG_POOL_MAX
        value: "25"
      - key: PG_POOL_MIN
        value: "3"
      - key: JWT_SECRET
        sync: false
      - key: PLISIO_SECRET_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: CASINO_SECRET_SIGN
        sync: false
      - key: CASINO_PROVIDER_URL
        sync: false
      - key: CASINO_API_KEY
        sync: false
      - key: CASINO_MERCHANT_ID
        sync: false
      - key: API_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: PLISIO_API_KEY
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
      - key: SPORTS_GAME_ODDS_API_KEY
        sync: false
      - key: OWNER_USERNAME
        value: "fanodgc"

  # ── Frontend (Static Site) ───────────────────────────────────────
  - type: static_site
    name: dgc-arcade-v2-frontend
    buildCommand: npm install -g pnpm && pnpm install && cd artifacts/dgc-arcade && pnpm run build
    staticPublishPath: artifacts/dgc-arcade/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          name: dgc-arcade-api
          type: web
          property: url
