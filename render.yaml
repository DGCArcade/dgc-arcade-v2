services:
  # ── Backend API ──────────────────────────────────────────────────
  - type: web
    name: dgc-arcade-api
    runtime: node
    rootDir: .
    buildCommand: npm install -g pnpm && pnpm install && cd artifacts/api-server && pnpm run build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PLISIO_SECRET_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: API_URL
        sync: false
      - key: NODE_ENV
        value: production
      # ── DGC-AI1 ────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false

  # ── Frontend ─────────────────────────────────────────────────────
  - type: web
    name: dgc-arcade-frontend
    runtime: node
    rootDir: .
    buildCommand: npm install -g pnpm && pnpm install && cd artifacts/dgc-arcade && pnpm run build
    startCommand: cd artifacts/dgc-arcade && pnpm run serve
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
