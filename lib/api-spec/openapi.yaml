openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DGC Arcade API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: games
    description: Games catalog
  - name: bets
    description: Betting / game sessions
  - name: transactions
    description: Deposits and withdrawals
  - name: leaderboard
    description: Leaderboard and stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new account (username + password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Users ─────────────────────────────────────────────────────────────
  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Games ─────────────────────────────────────────────────────────────
  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List all available games
      responses:
        "200":
          description: Games list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"

  /games/{gameId}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get a single game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  # ── Bets ──────────────────────────────────────────────────────────────
  /bets:
    post:
      operationId: placeBet
      tags: [bets]
      summary: Place a bet and resolve the round immediately
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetInput"
      responses:
        "200":
          description: Bet result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetResult"
        "400":
          description: Insufficient balance or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: listBets
      tags: [bets]
      summary: Get the recent bet history for current user
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent bets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BetRecord"

  /bets/recent-all:
    get:
      operationId: listRecentBetsAll
      tags: [bets]
      summary: Public feed of recent bets across all users (wow endpoint)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Recent public bets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BetRecord"

  # ── Transactions ──────────────────────────────────────────────────────
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List the authenticated user's transaction history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/deposit/initiate:
    post:
      operationId: initiateDeposit
      tags: [transactions]
      summary: Create an Plisio payment link for a deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInput"
      responses:
        "200":
          description: Plisio checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositLink"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/deposit/callback:
    post:
      operationId: plisioCallback
      tags: [transactions]
      summary: Plisio IPN webhook — credit balance on confirmed payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlisioCallbackInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /transactions/withdraw:
    post:
      operationId: requestWithdrawal
      tags: [transactions]
      summary: Request a withdrawal (queued for manual review)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawInput"
      responses:
        "200":
          description: Withdrawal queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Leaderboard & Stats ───────────────────────────────────────────────
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Top players by total winnings
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /stats:
    get:
      operationId: getPlatformStats
      tags: [leaderboard]
      summary: Platform-wide stats (players, total bets, biggest win)
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: ["string", "null"]

    # ── Auth ──────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
        password:
          type: string
          minLength: 6

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResult:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, username, balance, createdAt, role, isBanned]
      properties:
        id:
          type: integer
        username:
          type: string
        balance:
          type: number
        avatarUrl:
          type: ["string", "null"]
        totalBets:
          type: ["integer", "null"]
        totalWon:
          type: ["number", "null"]
        role:
          type: string
        isBanned:
          type: boolean
        createdAt:
          type: string
        accountType:
          type: string
        withdrawalsEnabled:
          type: boolean

    # ── Games ─────────────────────────────────────────────────────────
    Game:
      type: object
      required: [id, slug, name, description, minBet, maxBet, active]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        minBet:
          type: number
        maxBet:
          type: number
        houseEdge:
          type: number
        active:
          type: boolean

    # ── Bets ──────────────────────────────────────────────────────────
    BetInput:
      type: object
      required: [gameId, amount]
      properties:
        gameId:
          type: integer
        amount:
          type: number
        clientSeed:
          type: ["string", "null"]
        meta:
          type: ["object", "null"]
          description: Game-specific options (e.g. chosen side for coin flip)
          additionalProperties: {}

    BetResult:
      type: object
      required: [bet, newBalance, won, payout, multiplier]
      properties:
        bet:
          $ref: "#/components/schemas/BetRecord"
        newBalance:
          type: number
        won:
          type: boolean
        payout:
          type: number
        multiplier:
          type: number

    BetRecord:
      type: object
      required: [id, userId, username, gameId, gameName, amount, payout, won, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
        gameId:
          type: integer
        gameName:
          type: string
        amount:
          type: number
        payout:
          type: number
        won:
          type: boolean
        multiplier:
          type: ["number", "null"]
        serverSeed:
          type: ["string", "null"]
        clientSeed:
          type: ["string", "null"]
        meta:
          type: ["object", "null"]
          additionalProperties: {}
        createdAt:
          type: string

    # ── Transactions ──────────────────────────────────────────────────
    DepositInput:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
        currency:
          type: string
          description: "e.g. BTC, ETH, LTC, USDT"

    DepositLink:
      type: object
      required: [paymentUrl, trackId]
      properties:
        paymentUrl:
          type: string
        trackId:
          type: string

    PlisioCallbackInput:
      type: object
      properties:
        trackId:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        amount:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]
        orderId:
          type: ["string", "null"]

    WithdrawInput:
      type: object
      required: [amount, currency, address]
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 100000000
        currency:
          type: string
        address:
          type: string

    Transaction:
      type: object
      required: [id, userId, type, amount, currency, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [deposit, withdrawal, bet_win, bet_loss]
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        txHash:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        createdAt:
          type: string

    # ── Leaderboard ───────────────────────────────────────────────────
    LeaderboardEntry:
      type: object
      required: [rank, userId, username, totalWon, totalBets]
      properties:
        rank:
          type: integer
        userId:
          type: integer
        username:
          type: string
        avatarUrl:
          type: ["string", "null"]
        totalWon:
          type: number
        totalBets:
          type: integer

    PlatformStats:
      type: object
      required: [totalPlayers, totalBets, totalWagered, biggestWin]
      properties:
        totalPlayers:
          type: integer
        totalBets:
          type: integer
        totalWagered:
          type: number
        biggestWin:
          type: number
