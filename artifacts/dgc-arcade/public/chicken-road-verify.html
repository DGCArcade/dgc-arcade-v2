<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chicken Road · Provably Fair Verifier · DGC Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1219;
      --card: #1a2030;
      --border: rgba(255,255,255,0.1);
      --primary: #f6c90e;
      --text: #e8ecf4;
      --muted: #8b95a8;
      --ok: #68d391;
      --bad: #fc8181;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(ellipse at 50% 0%, #1e2840 0%, var(--bg) 55%);
      color: var(--text);
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; letter-spacing: 0.04em; text-transform: uppercase; }
    .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 20px; line-height: 1.45; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      background: #12182a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    textarea { min-height: 72px; resize: vertical; }
    .field { margin-bottom: 12px; }
    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, #ffd84d, var(--primary));
      color: #1a1200;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.75rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .ok { color: var(--ok); font-weight: 700; }
    .bad { color: var(--bad); font-weight: 700; }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(246,201,14,0.15);
      color: var(--primary);
      margin-bottom: 8px;
    }
    a { color: var(--primary); }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="badge">SHA-256 · HMAC-SHA512</span>
    <h1>Chicken Road Verifier</h1>
    <p class="sub">Paste seeds from your round after the server seed is revealed. Runs entirely in your browser — nothing is uploaded.</p>

    <div class="card">
      <div class="field">
        <label for="serverSeed">Server seed (revealed)</label>
        <textarea id="serverSeed" placeholder="Revealed after bust or cashout"></textarea>
      </div>
      <div class="field">
        <label for="expectedHash">SHA-256 commit (optional — from before play)</label>
        <input id="expectedHash" placeholder="Pre-game hash shown during round" />
      </div>
      <div class="field">
        <label for="clientSeed">Client seed</label>
        <input id="clientSeed" value="chicken-road" />
      </div>
      <div class="field">
        <label for="nonce">Nonce</label>
        <input id="nonce" type="number" value="1" min="1" />
      </div>
      <div class="field">
        <label for="tier">Difficulty</label>
        <select id="tier">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="expert">Expert</option>
        </select>
      </div>
      <button type="button" id="run">Verify round</button>
    </div>

    <div class="card" id="out" hidden>
      <pre id="result"></pre>
    </div>

    <p class="sub" style="margin-top:16px">Or open your session JSON: <code>/api/chicken-road/verify/&lt;sessionId&gt;</code> after the round ends.</p>
  </div>

  <script src="/chicken-road-verify.js"></script>
  <script>
    const btn = document.getElementById("run");
    const out = document.getElementById("out");
    const result = document.getElementById("result");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      out.hidden = false;
      result.textContent = "Computing…";
      try {
        const serverSeed = document.getElementById("serverSeed").value.trim();
        const clientSeed = document.getElementById("clientSeed").value.trim() || "chicken-road";
        const nonce = parseInt(document.getElementById("nonce").value, 10) || 1;
        const tier = document.getElementById("tier").value;
        const expectedHash = document.getElementById("expectedHash").value.trim();
        if (!serverSeed) throw new Error("Server seed is required");

        const r = await verifyChickenRoad(serverSeed, clientSeed, nonce, tier, expectedHash || undefined);
        const lines = [
          r.hashValid ? "✓ SHA-256 commit matches revealed seed" : "✗ Hash mismatch — check commit vs seed",
          "",
          `Hash: ${r.serverSeedHash}`,
          `Tier: ${r.tierLabel} (${r.tier})`,
          `Death steps (0-indexed): ${JSON.stringify(r.deathSteps)}`,
          `Hazards: ${JSON.stringify(r.hazardTypes)}`,
          "",
          r.algorithm,
        ];
        result.innerHTML = lines.map((line, i) => {
          if (i === 0) return `<span class="${r.hashValid ? "ok" : "bad"}">${line}</span>`;
          return line;
        }).join("\n");
      } catch (e) {
        result.innerHTML = `<span class="bad">${e.message || String(e)}</span>`;
      } finally {
        btn.disabled = false;
      }
    });

    const params = new URLSearchParams(location.search);
    if (params.get("hash")) document.getElementById("expectedHash").value = params.get("hash");
    if (params.get("seed")) document.getElementById("serverSeed").value = params.get("seed");
    if (params.get("client")) document.getElementById("clientSeed").value = params.get("client");
    if (params.get("nonce")) document.getElementById("nonce").value = params.get("nonce");
    if (params.get("tier")) document.getElementById("tier").value = params.get("tier");
  </script>
</body>
</html>
